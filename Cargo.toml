[package]
name = "asf"
version = "0.1.0"
edition = "2024"
description = "Find a past coding-agent session by name, or by anything said inside it"
repository = "https://github.com/wassname/asf"
license = "MIT"

[dependencies]
# ripgrep's own engine, as libraries: the walk, the matcher, the searcher
ignore = "0.4.31"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# preserve_order: a record's keys must come back in the order the agent wrote them,
# because the first `text` key found is the one shown
serde_json = { version = "1.0.151", features = ["preserve_order"] }
clap = { version = "4.6", features = ["derive"] }
skim = "0.20"
regex = "1.11"
jiff = "0.2"
libc = "0.2"

[profile.release]
lto = true
strip = true
